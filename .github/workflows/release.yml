---
name: release

"on":
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: build the package but do not create a release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and publish
    runs-on: ubuntu-24.04
    permissions:
      # required by softprops/action-gh-release to create the release
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: the git tag must match VERSION and CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "${tag_version}" != "${file_version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION (${file_version})"
            exit 1
          fi
          ./tests/check-version-consistency.sh

      - name: pin the build timestamp to the tagged commit
        # reproducible-builds.org/specs/source-date-epoch: build-deb.sh uses
        # this instead of the wall clock for the dates it embeds, and dpkg-deb
        # clamps every file mtime to it. Two builds of the same commit are then
        # byte identical, so anyone can rebuild a release and compare its
        # sha256 against the published asset - which is how you would notice a
        # binary that did not come from this source.
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "${GITHUB_ENV}"

      - name: build package
        run: ./packaging/debian/build-deb.sh

      - name: generate checksums
        run: |
          cd dist
          sha256sum ./*.deb > SHA256SUMS
          cat SHA256SUMS

      - name: extract the changelog section for this release
        id: notes
        run: |
          version="$(cat VERSION)"
          {
            echo 'body<<LRCM_EOF'
            awk -v v="## ${version}" '
              $0 == v { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo 'LRCM_EOF'
          } >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: lrcm-deb
          path: dist/
          if-no-files-found: error

      - name: create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          files: |
            dist/*.deb
            dist/SHA256SUMS
          body: ${{ steps.notes.outputs.body }}
          draft: false
          # SemVer 2.0.0 §9: anything after the first hyphen is a pre-release
          # identifier - rc, beta, alpha, 0.3.7 - not just "-rc".
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
