---
# Prepares a Fedora client for lrcm.
#
# Uses the dnf5 module: Fedora 41 and later ship dnf5, whose python bindings
# (python3-libdnf5) are present by default, while ansible.builtin.dnf needs the
# dnf4 bindings that such a system no longer installs.
#
#   ansible-playbook -i 127.0.0.1, -c local client-setup/playbook-fedora.yaml
- name: Prepare a Fedora client for lrcm
  hosts: 127.0.0.1
  connection: local
  gather_facts: false
  become: true
  tasks:
    - name: Install the lrcm runtime dependencies
      ansible.builtin.dnf5:
        name:
          - python3
          - python3-GitPython
          - python3-ansible-runner
          - python3-jinja2
          - python3-validators
          - python3-distro
          - ansible-core
          - git
          - cronie
          - crontabs
        state: present
        update_cache: true

    - name: Enable and start the crond service
      ansible.builtin.systemd:
        name: crond
        state: started
        enabled: true
